name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'sbt test selector (e.g. "*SnappyTest"); empty runs the full suite'
        required: false
        default: ''

jobs:
  code_format:
    name: code format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: scalafmt test
        run: ./sbt scalafmtCheckAll
  test-jdk:
    strategy:
      matrix:
        version: [ '8', '11', '17', '21', '24' ]
    name: test jdk${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # plain (uncoloured) sbt output so the test summary line is readable in the log
      SBT_OPTS: -no-colors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-jdk${{ matrix.version }}-${{ hashFiles('**/*.sbt') }}
          restore-keys: ${{ runner.os }}-jdk${{ matrix.version }}-
      - name: Test
        # SnappyTest.isTooLarge* (Snappy.java bounds checks) skip themselves when CI=true;
        # run them here, with enough heap for their ~2GB arrays in the forked test JVM
        env:
          CI: 'false'
          JAVA_TOOL_OPTIONS: -Xmx4g
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./sbt "testOnly ${{ inputs.test-filter }}"
          else
            ./sbt test
          fi
      - name: List upstream @Ignore'd tests and their reasons
        run: grep -rn -A3 '@Ignore' src/test/java
      - name: Package
        if: ${{ matrix.version == '11' }}
        run: |
          ./sbt clean package
          unzip -p target/snappy-java-*.jar META-INF/MANIFEST.MF
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.version == '11' }}
        with:
          name: snappy-java-jar
          path: target/snappy-java-*.jar
          if-no-files-found: error
