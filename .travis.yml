branches:
  only:
  - main

language: java

jdk:
  - openjdk11

os: linux

# s390x/ppc64le Travis queues never start a job on the ali-security fork; run the suite on amd64
arch:
  - amd64

# plain (uncoloured) sbt output so the test summary line is readable in the log
env:
  global:
    - SBT_OPTS=-no-colors

script:
#  - sudo apt-get install -y openjdk-11-jdk;
#  - export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-s390x && export PATH=$JAVA_HOME/bin:$PATH;
  - ./sbt test
  # name each upstream @Ignore'd test and its reason in the log
  - grep -rn -A3 '@Ignore' src/test/java
